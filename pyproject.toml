[project]
name = "vuljector"
version = "0.2.0"
description = "Structural vulnerability injection for synthetic security dataset creation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "python-dotenv>=1.0.0",
    # Agent layer — mini-swe-agent v2+ required (v1 has incompatible imports)
    "mini-swe-agent>=2.0.0",
    "litellm>=1.0.0",
    # Container management
    "docker>=6.0.0",
    # C/C++ AST parsing (Python 3.13 compatible)
    "tree-sitter>=0.24",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    # JS/TS AST parsing
    "tree-sitter-javascript>=0.24",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
# After `uv pip install -e .`, run as: vuljector setup flask
vuljector = "vuljector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: all packages live under src/
packages = [
    "src/agent_tasks",
    "src/injector",
    "src/selector",
    "src/setup",
    "src/utils",
    "src/verifier",
    "src/vuljector",
]

[dependency-groups]
dev = []

# ── Notes ────────────────────────────────────────────────────────────────────
# Install (editable):  uv pip install -e .
# Run the CLI:         vuljector setup <project>   (API keys go in src/.env)
